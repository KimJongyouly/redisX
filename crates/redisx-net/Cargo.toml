[package]
name = "redisx-net"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Phase 1 of the redis_src -> redisX migration: RESP protocol + mio-based single-threaded event loop, ported from resp_parser.c / networking.c / ae.c. See redis_document/25_redisX.md."

[dependencies]
redisx-core = { path = "../redisx-core" }
mio = { version = "1.0", features = ["os-poll", "net", "os-ext"] }

[lib]
name = "redisx_net"
path = "src/lib.rs"
