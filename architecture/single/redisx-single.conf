# redisX 단일 인스턴스(single) 샘플 설정
# 실행: 이 파일이 있는 폴더로 cd한 뒤
#   redisx-server ./redisx-single.conf
# (dir이 상대 경로라 cwd 기준으로 해석된다 — 상위 README 참고)

port 2417
dir .
dbfilename dump.rdb
databases 16

# --- AOF: 기본 off ---
appendonly no
appendfilename appendonly.aof

# --- SLOWLOG: 기본 off (slowlog-file-path가 빈 문자열이면 비활성) ---
# 켜려면 아래 주석을 해제하거나, 서버를 띄운 채로
#   redisx-cli -p 2417 CONFIG SET slowlog-file-path ./redisx-slow.log
#   redisx-cli -p 2417 CONFIG SET slowlog-log-slower-than 10000
# 로 런타임에 적용한다 (재시작 불필요 — CONFIG SET이 바로 반영된다).
# slowlog-file-path ./redisx-slow.log
slowlog-log-slower-than 10000

# --- 메모리 정책 ---
maxmemory 0
maxmemory-policy noeviction

# --- 인증 (기본 off) ---
# requirepass secret   # 켜려면 주석 해제 후 재시작 (CONFIG SET requirepass secret 로도 가능)
